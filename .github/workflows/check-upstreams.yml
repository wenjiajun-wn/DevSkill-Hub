name: Check upstream changes

on:
  schedule:
    - cron: '43 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-review
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_upstreams.py
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python scripts/validate_catalog.py
      - run: python scripts/render_catalog.py --check
      - run: python scripts/check_links.py
      - run: python -m unittest discover -s tests -v
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          branch: automation/upstream-review
          delete-branch: true
          title: 'chore: review upstream changes'
          commit-message: 'chore: report upstream changes'
          body: |
            Monitored upstream paths differ from their recorded review baselines.
            Inspect the report and recheck installation, license evidence, and relevant
            smoke tests before updating baselines. No verification claims are renewed.
          add-paths: docs/upstream-status.md
