name: Update repository stars

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-repository-stars
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Refresh snapshot and generated pages
        run: python scripts/update_stars.py
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python scripts/validate_catalog.py
      - run: python scripts/render_catalog.py --check
      - run: python scripts/check_links.py
      - run: python -m unittest discover -s tests -v
      - name: Propose refresh on a dedicated branch
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          branch: automation/update-stars
          delete-branch: true
          commit-message: 'chore: refresh repository stars'
          title: 'chore: refresh repository stars'
          body: |
            Refresh repository-level GitHub star snapshots and regenerate catalog pages.

            Each upstream repository is requested once. Content review dates, licensing
            evidence, and installation/effectiveness verification are not renewed.

            Local validation, generated-file checks, link checks, and unit tests ran
            before this PR was proposed. Review and merge manually.
          add-paths: |
            catalog/skills.yaml
            catalog/*.md
            README.md
            README.zh-CN.md
            THIRD_PARTY_NOTICES.md
            docs/verification.md
            docs/blog/*.md
