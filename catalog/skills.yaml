- id: frontend-design
  name: Frontend Design
  category: frontend
  description: Distinctive visual direction, typography, and intentional interface design.
  description_zh: 指导有辨识度的视觉风格、字体排版与界面设计。
  repository: anthropics/skills
  skill_path: skills/frontend-design/SKILL.md
  skill_url: https://github.com/anthropics/skills/blob/main/skills/frontend-design/SKILL.md
  upstream_name: frontend-design
  source_commit: 41bbe19d1a1a7eaab5e7bb9050a417e5c6cffc8f
  skill_updated_at: '2026-09-03T16:37:13Z'
  tags:
  - frontend
  - ui
  - design
  use_cases:
  - Shape a new product page with a clear visual identity.
  - Refine typography, color, and layout in an existing interface.
  use_cases_zh:
  - 为新产品页面建立清晰的视觉方向。
  - 优化现有界面的字体、颜色与布局。
  install:
    command: '/plugin marketplace add anthropics/skills

      /plugin install example-skills@anthropic-agent-skills'
    documentation_url: https://github.com/anthropics/skills#claude-code
    notes: Enter both commands inside Claude Code. This installs the example-skills bundle, including
      Frontend Design, rather than only this skill.
    notes_zh: 在 Claude Code 内输入两条命令；安装的是包含 Frontend Design 的 example-skills 插件包，并非仅此一个 Skill。
  verification:
    metadata: true
    installation: true
    installation_tested: false
    effectiveness: false
    last_reviewed: '2026-10-21T05:50:39Z'
    test_report_url: null
  review_notes: Confirmed skills/frontend-design/SKILL.md. Used the upstream Claude Code marketplace workflow
    instead of assuming an undocumented npx command. License is verified at skill level.
  review_notes_zh: 实际路径为 skills/frontend-design/SKILL.md。采用上游明确记录的 Claude Code 插件安装方式，未推断未记录的 npx 命令；许可证按此
    Skill 单独核查。
- id: ui-ux-pro-max
  name: UI/UX Pro Max
  category: frontend
  description: Searchable design guidance for palettes, typography, accessibility, and frontend stacks.
  description_zh: 提供可检索的配色、字体、无障碍与多技术栈界面设计指导。
  repository: nextlevelbuilder/ui-ux-pro-max-skill
  skill_path: .claude/skills/ui-ux-pro-max/SKILL.md
  skill_url: https://github.com/nextlevelbuilder/ui-ux-pro-max-skill/blob/main/.claude/skills/ui-ux-pro-max/SKILL.md
  upstream_name: ui-ux-pro-max
  source_commit: a38d04c3d5c298c851dbe5e6ee1965ee3de42cb5
  skill_updated_at: '2026-08-13T17:08:23Z'
  tags:
  - frontend
  - ui
  - ux
  - design-system
  use_cases:
  - Choose a coherent palette and type system.
  - Review responsive interactions and accessibility for a frontend stack.
  use_cases_zh:
  - 选择一致的配色与字体系统。
  - 审查特定前端技术栈的响应式交互和无障碍体验。
  install:
    command: 'npm install -g ui-ux-pro-max-cli

      uipro init --ai codex'
    documentation_url: https://github.com/nextlevelbuilder/ui-ux-pro-max-skill#installation
    notes: Run from your project root. The example targets Codex; upstream also documents --ai claude
      and --ai cursor. Node.js/npm and Python 3 are prerequisites. The CLI supplies platform-specific
      files and supporting data.
    notes_zh: 在项目根目录运行，示例面向 Codex；上游另有 --ai claude 和 --ai cursor。需要 Node.js/npm 与 Python 3。CLI 会生成对应平台文件并包含配套数据。
