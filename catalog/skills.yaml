    metadata: true
    installation: true
    installation_tested: false
    effectiveness: false
    last_reviewed: '2026-10-21T05:50:39Z'
    test_report_url: null
  review_notes: Verified .claude/skills/ui-ux-pro-max/SKILL.md as the committed development copy. Upstream
    identifies src/ui-ux-pro-max as source data/templates and recommends its CLI for installation. Current
    npm package is ui-ux-pro-max-cli; older uipro-cli releases are described as stale.
  review_notes_zh: 核实 .claude/skills/ui-ux-pro-max/SKILL.md 为仓库内开发版本；src/ui-ux-pro-max 保存源数据和模板，上游推荐 CLI
