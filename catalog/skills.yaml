skills:
- id: frontend-design
  name: Frontend Design
  category: frontend
  description: Distinctive visual direction, typography, and intentional interface design.
  description_zh: 指导有辨识度的视觉风格、字体排版与界面设计。
  repository: anthropics/skills
  skill_path: skills/frontend-design/SKILL.md
  skill_url: https://github.com/anthropics/skills/blob/main/skills/frontend-design/SKILL.md
  upstream_name: frontend-design
  source_commit: 41bbe19d1a1a7eaab5e7bb9050a417e5c6cffc8f
  skill_updated_at: '2026-09-03T16:37:13Z'
  tags:
  - frontend
  - ui
  - design
  use_cases:
  - Shape a new product page with a clear visual identity.
  - Refine typography, color, and layout in an existing interface.
  use_cases_zh:
  - 为新产品页面建立清晰的视觉方向。
  - 优化现有界面的字体、颜色与布局。
  install:
    command: '/plugin marketplace add anthropics/skills

      /plugin install example-skills@anthropic-agent-skills'
    documentation_url: https://github.com/anthropics/skills#claude-code
    notes: Enter both commands inside Claude Code. This installs the example-skills bundle, including
      Frontend Design, rather than only this skill.
    notes_zh: 在 Claude Code 内输入两条命令；安装的是包含 Frontend Design 的 example-skills 插件包，并非仅此一个 Skill。
  verification:
    metadata: true
    installation: true
    installation_tested: true
    effectiveness: false
    last_reviewed: '2026-10-21T07:07:38Z'
    test_report_url: null
    installation_test_report_url: https://github.com/wenjiajun-wn/DevSkill-Hub/blob/main/docs/evaluations/installation-smoke.md#frontend-design
    smoke_scope: manual-walkthrough
    smoke_report_url: https://github.com/wenjiajun-wn/DevSkill-Hub/blob/main/docs/evaluations/functional-smoke.md#frontend-design
  review_notes: 'Confirmed skills/frontend-design/SKILL.md. Used the upstream Claude Code marketplace
    workflow instead of assuming an undocumented npx command. License is verified at skill level. Follow-up:
    installation executed in an isolated project; bounded manual-walkthrough evidence is linked separately.
    Comparative effectiveness is not certified.'
  review_notes_zh: 实际路径为 skills/frontend-design/SKILL.md。采用上游明确记录的 Claude Code 插件安装方式，未推断未记录的 npx 命令；许可证按此
