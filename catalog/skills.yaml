- id: ui-ux-pro-max
  name: UI/UX Pro Max
  category: frontend
  description: Searchable design guidance for palettes, typography, accessibility, and frontend stacks.
  description_zh: 提供可检索的配色、字体、无障碍与多技术栈界面设计指导。
  repository: nextlevelbuilder/ui-ux-pro-max-skill
  skill_path: .claude/skills/ui-ux-pro-max/SKILL.md
  skill_url: https://github.com/nextlevelbuilder/ui-ux-pro-max-skill/blob/main/.claude/skills/ui-ux-pro-max/SKILL.md
  upstream_name: ui-ux-pro-max
  source_commit: a38d04c3d5c298c851dbe5e6ee1965ee3de42cb5
  skill_updated_at: '2026-08-13T17:08:23Z'
  tags:
  - frontend
  - ui
  - ux
  - design-system
  use_cases:
  - Choose a coherent palette and type system.
  - Review responsive interactions and accessibility for a frontend stack.
  use_cases_zh:
  - 选择一致的配色与字体系统。
  - 审查特定前端技术栈的响应式交互和无障碍体验。
  install:
    command: 'npm install -g ui-ux-pro-max-cli

      uipro init --ai codex'
    documentation_url: https://github.com/nextlevelbuilder/ui-ux-pro-max-skill#installation
    notes: Run from your project root. The example targets Codex; upstream also documents --ai claude
      and --ai cursor. Node.js/npm and Python 3 are prerequisites. The CLI supplies platform-specific
      files and supporting data.
    notes_zh: 在项目根目录运行，示例面向 Codex；上游另有 --ai claude 和 --ai cursor。需要 Node.js/npm 与 Python 3。CLI 会生成对应平台文件并包含配套数据。
  verification:
    metadata: true
    installation: true
    installation_tested: true
    effectiveness: false
    last_reviewed: '2026-10-21T07:07:38Z'
    test_report_url: null
    installation_test_report_url: https://github.com/wenjiajun-wn/DevSkill-Hub/blob/main/docs/evaluations/installation-smoke.md#ui-ux-pro-max
    smoke_scope: tool-smoke
    smoke_report_url: https://github.com/wenjiajun-wn/DevSkill-Hub/blob/main/docs/evaluations/functional-smoke.md#ui-ux-pro-max
  review_notes: 'Verified .claude/skills/ui-ux-pro-max/SKILL.md as the committed development copy. Upstream
    identifies src/ui-ux-pro-max as source data/templates and recommends its CLI for installation. Current
    npm package is ui-ux-pro-max-cli; older uipro-cli releases are described as stale. Follow-up: installation
    executed in an isolated project; bounded tool-smoke evidence is linked separately. Comparative effectiveness
    is not certified.'
  review_notes_zh: 核实 .claude/skills/ui-ux-pro-max/SKILL.md 为仓库内开发版本；src/ui-ux-pro-max 保存源数据和模板，上游推荐 CLI
    安装。当前包名为 ui-ux-pro-max-cli，上游已说明旧 uipro-cli 版本过时。 后续复查：已在隔离项目执行安装，限定范围的冒烟/人工演练证据另附链接，未认证对照实验中的效果提升。
